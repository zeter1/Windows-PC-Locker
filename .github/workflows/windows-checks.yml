name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python source
        shell: pwsh
        run: python -m py_compile computer_locker.pyw

      - name: Run safe self-test
        shell: pwsh
        run: python computer_locker.pyw --self-test
