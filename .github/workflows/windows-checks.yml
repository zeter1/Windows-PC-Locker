name: Windows checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile Python source
        shell: pwsh
        run: python -m py_compile computer_locker.pyw

      - name: Run safe self-test
        shell: pwsh
        run: python computer_locker.pyw --self-test

      - name: Build and verify full Windows distribution
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')
        shell: cmd
        run: build_exe.bat --ci

      - name: Validate published packaging metadata
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')
        shell: pwsh
        run: |
          $required = @(
            'dist/Windows-PC-Locker.exe',
            'dist/Windows-PC-Locker-portable-x64.zip',
            'dist/build_info.json',
            'dist/SHA256SUMS.txt',
            'build_logs/last_build_summary.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing packaging artifact: $path" }
          }
          $info = Get-Content 'dist/build_info.json' -Raw | ConvertFrom-Json
          if ($info.app -ne 'Windows-PC-Locker') { throw 'Unexpected build_info app name.' }
          $summary = Get-Content 'build_logs/last_build_summary.json' -Raw | ConvertFrom-Json
          if ($summary.status -ne 'success') { throw "Packaging summary is not success: $($summary.status)" }
          Get-FileHash 'dist/Windows-PC-Locker.exe' -Algorithm SHA256
          Get-FileHash 'dist/Windows-PC-Locker-portable-x64.zip' -Algorithm SHA256

      - name: Upload verified Windows distribution
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[package]')
        uses: actions/upload-artifact@v4
        with:
          name: Windows-PC-Locker-portable-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
